name: Build Windows package

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-windows.yml"
      - "payload_url.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download build payload
        shell: pwsh
        run: |
          $url = (Get-Content "payload_url.txt" -Raw).Trim()
          Invoke-WebRequest -Uri $url -OutFile "payload.zip"

      - name: Extract payload
        shell: pwwsh
        run: Expand-Archive -Path "payload.zip" -DestinationPath "payload" -Force
